<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tigres do Riacho</title>
<style>
  html,body{margin:0;height:100%;background:#1C130E;color:#fff;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:120px;height:120px}
  h1{font-size:20px;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
  p{color:#C7B9AC;font-size:15px;margin:0 0 22px}
  button{background:#F26B1D;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:600}
</style>
</head>
<body>
<main>
  <div>
    <img src="logo.png" alt="">
    <h1>Tigres do Riacho</h1>
    <p>Sem conexão com a internet.<br>Conecte-se e tente de novo.</p>
    <button onclick="location.href='https://tigresapp.vercel.app/painel'">Tentar de novo</button>
  </div>
</main>
<script>if(navigator.onLine)location.replace('https://tigresapp.vercel.app/painel')</script>
</body>
</html>
