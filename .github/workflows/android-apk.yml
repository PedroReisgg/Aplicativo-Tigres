name: Gerar APK Android

# Gera o APK do app (Capacitor) e salva em public/download/tigres-do-riacho.apk,
# que a página /app do site oferece para download.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-www/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Salvar APK no repositório
        run: |
          mkdir -p public/download
          cp android/app/build/outputs/apk/debug/app-debug.apk public/download/tigres-do-riacho.apk
          ls -la public/download
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/download/tigres-do-riacho.apk
          git commit -m "chore(apk): atualiza APK Android" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        with:
          name: tigres-do-riacho-apk
          path: public/download/tigres-do-riacho.apk
